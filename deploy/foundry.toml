[profile.default]
src = "script"
out = "out"
libs = ["lib"]
solc = "0.8.36"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../" }]
allow_paths = ["../"]
remappings = [
  "spark-contracts/=../spark/",
  "spark-v2-contracts/=../spark-v2/",
]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
